# ==================================================================================================
# recipes/scripts/pyproject.toml
# ==================================================================================================

[project]
name = "scripts"
version = "0.1.0"
description = "CLIs for Typst paratext, PDF merge, and PDF release metadata"
license = "Apache-2.0"
authors = [{ name = "Sierra Arn", email = "unweariedheart@gmail.com" }]
dependencies = []

[project.scripts]
typst-compile = "scripts.typst_compile:main"
pdf-merge = "scripts.pdf_merge:main"
write-pdf-metadata = "scripts.write_pdf_metadata:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scripts"]

# ==================================================================================================
